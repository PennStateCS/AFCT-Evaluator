name: CI

# The evaluator's only automated check. Nothing ran here before, so a pull request that
# stopped it compiling could be merged and nobody would know until somebody built it.
#
# Two things run here, and the second is the one that matters. Building proves the evaluator
# compiles. The golden cases run the built jar against submissions whose right answer is
# already known, so a change that alters a verdict fails the build rather than reaching a
# course. The evaluator decides marks; a green build that grades differently is the failure
# worth catching.
#
# The same cases are kept in the dashboard repository, where they guard the jar that ships
# there. Deliberately two copies: this one guards the code, that one guards the jar.
on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
  pull_request:
  # So a commit that never had a run can get one without pushing an empty change.
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first answer stale, so stop paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Pinned to the version the pom compiles against, rather than whatever the runner
      # ships, so a runner image change cannot quietly move the target.
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The client is not on Maven Central; a copy lives in afct-client/ and has to be put
      # into the local repository before Maven can resolve it. The same script people run
      # on their own machines, so there is one way to do this rather than two.
      - name: Install the client dependency
        run: ./scripts/install-client-dependency.sh

      # `clean` matters here: target/ is committed to this repository and still holds jars
      # from old versions, so without it the build output is mixed in with stale ones and
      # the artifact below could carry a jar this commit never produced.
      - name: Build
        run: mvn -B clean verify

      # The cfganalyzer binary is committed here as a Linux x86-64 executable, and git does
      # not record the execute bit for everyone, so make sure it can actually run before a
      # CFG case tries to use it.
      - name: Run the golden cases
        run: |
          chmod +x bin/cfganalyzer
          python3 scripts/run-golden-cases.py

      - name: Keep the jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afct-evaluator-jar
          path: |
            target/afct-evaluator.jar
            target/afct-evaluator-v*.jar
          # A packaging change that stops producing a jar should fail the run rather than
          # upload an empty artifact nobody notices until they need it.
          if-no-files-found: error
